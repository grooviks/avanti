# Temporary HTTP-only configuration used before the first TLS certificate exists.
# Copy this file to /etc/nginx/conf.d/avantistyle.conf, obtain the certificate,
# then replace it with avantistyle.conf from this directory.
server {
    listen 80;
    listen [::]:80;
    server_name avantistyle.ru www.avantistyle.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://avantistyle.ru$request_uri;
    }
}
