# Final configuration for Nginx on the same VM as Docker Compose.
# The web container listens only on 127.0.0.1:3001 (see compose.prod.yaml).

server {
    listen 80;
    listen [::]:80;
    server_name avantistyle.ru www.avantistyle.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://avantistyle.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.avantistyle.ru;

    ssl_certificate /etc/nginx/ssl/avantistyle_ru.crt;
    ssl_certificate_key /etc/nginx/ssl/avantistyle_ru.key;

    return 301 https://avantistyle.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name avantistyle.ru;

    ssl_certificate /etc/nginx/ssl/avantistyle_ru.crt;
    ssl_certificate_key /etc/nginx/ssl/avantistyle_ru.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
